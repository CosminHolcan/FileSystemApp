name: Deploy Azure Functions

on:
  push:
    branches:
      - functions

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy Azure Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.203'

      # Build and publish Azure Functions
      - name: Build and publish Azure Functions
        run: |
          dotnet publish ./server/Functions/Functions.csproj -c Release -o ${{ github.workspace }}/functions-publish

      # Login to Azure using OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploy Azure Functions
      - name: Deploy Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: filesystemappfunctions
          package: ${{ github.workspace }}/functions-publish