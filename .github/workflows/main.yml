name: Deploy to Azure

on:
  push:
    branches:
      - main  # Trigger deployment on push to main branch

jobs:
  deploy:
    name: Build and Deploy Fullstack App
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Cache npm dependencies for the frontend
      - name: Cache npm dependencies client
        uses: actions/cache@v2
        with:
          path: client/node_modules
          key: ${{ runner.os }}-npm-client-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-client-

      # Step 3: Setup Node.js for the frontend build
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # Specify your Node.js version

      # Step 4: Build the React frontend
      - name: Build React app
        working-directory: ./client
        run: |
          npm install
          npm run build

      # Step 5: Copy React build to C# project wwwroot
      - name: Copy React build to C# wwwroot
        run: |
          rm -rf ./server/wwwroot/*  # Clear any existing frontend files
          cp -R ./client/build/* ./server/wwwroot/

      # Step 6: Setup .NET environment
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.100'

      # Step 7: Build and publish the backend
      - name: Build and publish the backend
        working-directory: ./server
        run: |
          dotnet restore
          dotnet publish -c Release -o publish

      # Step 8: Deploy to Azure App Service
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: FileSystemApp
          slot-name: production
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./server/publish
